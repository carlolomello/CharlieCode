appId: co.charlie.app
productName: Charlie
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
