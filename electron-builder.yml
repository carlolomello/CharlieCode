appId: co.charliecode.app
productName: CharlieCode
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true

mac:
  category: public.app-category.developer-tools
  # Ad-hoc signing ("-") keeps the unsigned arm64 build launchable on Apple
  # Silicon; hardened runtime requires a real Developer ID, so it stays off.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
