name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release da aggiornare (es. v0.0.1)'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg x64 + arm64)
            os: macos-latest
            script: dist:mac
            artifacts: release/*.dmg
          - name: Windows (installer x64)
            os: windows-latest
            script: dist:win
            artifacts: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: build installer
        # `--publish never`: electron-builder must not upload on its own. With
        # GH_TOKEN set it does, and the macOS runner names the file with dots
        # while the Windows runner uses hyphens — two identical 124 MB
        # installers on the release. The publish job below is the only writer.
        run: pnpm ${{ matrix.script }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: charliecode-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  # Attach the installers to the GitHub release for the tag. This is how the
  # ~120 MB files get published without uploading them by hand: GitHub allows
  # 2 GB per release asset, the 50 MB limit only exists in the browser bridge.
  publish:
    name: publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list assets
        run: ls -lh dist

      - name: drop stale assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            if [ -f "dist/$name" ]; then continue; fi
            echo "removing $name"
            gh release delete-asset "$tag" "$name" --yes || true
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CharlieCode ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
