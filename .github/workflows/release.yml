name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release da aggiornare (es. v0.0.1)'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg x64 + arm64)
            os: macos-latest
            script: dist:mac
            artifacts: release/*.dmg
          - name: Windows (installer x64)
            os: windows-latest
            script: dist:win
            artifacts: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: build installer
        # No GH_TOKEN on purpose: electron-builder publishes by itself when it
        # finds one, which is how a second, differently-named copy of the
        # Windows installer ended up on the release. The publish job is the
        # only writer.
        run: pnpm ${{ matrix.script }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: charliecode-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  # Attach the installers to the GitHub release for the tag. This is how the
  # ~120 MB files get published without uploading them by hand: GitHub allows
  # 2 GB per release asset, the 50 MB limit only exists in the browser bridge.
  publish:
    name: publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # macOS and Windows disagree about spaces in file names ("CharlieCode
      # Setup 0.0.1.exe" vs "CharlieCode-Setup-0.0.1.exe"), and GitHub turns the
      # spaces into dots. One canonical name per platform keeps the README links
      # stable and the release free of duplicates.
      - name: canonical asset names
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cd dist
          exe="$(ls ./*.exe 2>/dev/null | head -1 || true)"
          if [ -n "$exe" ]; then
            mv "$exe" "CharlieCode-Setup-${version}.exe"
          fi
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CharlieCode ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe

      # After the upload, so a failed publish never leaves the release empty.
      - name: drop assets that are not part of this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          names="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          for name in $names; do
            if [ -f "dist/$name" ]; then continue; fi
            echo "removing stale asset: $name"
            gh release delete-asset "$tag" "$name" --yes
          done
